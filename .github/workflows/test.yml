name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: node --check public/app.js
      - run: node --check public/analyzer.js
      - run: node --check public/analyzer-worker.js
